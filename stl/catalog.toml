# Every printable file in stl/, one row each. This is the source of truth:
# build_catalog.py checks it against the files on disk and writes stl/README.md from it.
#
# family: name, dir (under stl/), about, board, material, script (repo-relative), edit (what to change
#   in that script), readme, renders (the first is the hero image), featured, also (files from another
#   family that this one needs). A part may override board, script, edit or material.
# part: file (under stl/), what, status, log, fixed, print, note.
#   status: proven | printed | needs-work | failed | unprinted. Superseded files are deleted, not kept.
#   log: the date of the docs/PRINT-LOG.md entry that backs the status (required unless unprinted).
#   fixed: needs-work only. true = the current file already has the requested change, unprinted since.
# board: "1.28", "1.46 cover glass", "1.46 bare", "any", or a list of them.

[[family]]
id = "fit-gauges"
name = "Fit gauges"
dir = "fit-gauges"
about = "Ten-minute prints that measure how your printer and your badge fit, before you commit to a case or stand. Print both first and tell the owner which slot and which ring fit."
board = "any"
material = "PLA or PETG"
renders = ["renders/fit-gauge.png", "pocketwatch/renders/bore-gauge.png"]
parts = [
  { file = "fit-gauges/Slot fit gauge.stl", what = "Eight slots, 3.0 to 6.5 mm. Slot N has N dots under it; slot 1 is at the chamfered end. Push the badge's rim into each: the narrowest slot it enters sets the desk stands' groove.", sets = "1.28 rim thickness: `gap` in `build_stands.py` `BOARDS`", script = "build_fit_gauge.py", edit = "`WIDTHS`", status = "proven", log = "2026-09-18", print = "flat, as exported", note = "Owner's 1.28 seated in slot 5 (5.0 mm)." },
  { file = "fit-gauges/Pocketwatch - bore fit gauge.stl", what = "The front of the pocketwatch case only, as four rings. Ring N has N dots. Drop the badge in from the back, screen first: the tightest ring where the glass sits flat on the lip sets the case bore.", sets = "case bore clearance: `Case.RAD_CLR` in `pocketwatch/build_pocketwatch.py`", board = "1.28", script = "pocketwatch/build_bore_gauge.py", edit = "`CLRS`", status = "proven", log = "2026-10-13", print = "bezel down, about 10 minutes", note = "Only ring 4 (`RAD_CLR` 1.15) fit the owner's print; 0.85 did not, so the true minimum is between." },
]

